<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="add-recipe.css">
    <title>הוספת מתכון</title>
</head>
<body>
    <form action="#" method="get">
        <h1>הוספת מתכון</h1>
        
        <div class="field">
            <label for="title">שם המתכון</label>
            <input type="text" id="title" name="title" placeholder="למשל: עוגת תפוחים" required>
        </div>

        <fieldset>
            <legend>סוג המנה</legend>
            <div class="options">
                <span class="option">
                    <input type="radio" id="meat" name="kind" value="meat" required>
                    <label for="meat">בשרי</label>
                </span>
                <span class="option">
                    <input type="radio" id="dairy" name="kind" value="dairy" required>
                    <label for="dairy">חלבי</label>
                </span>
                <span class="option">
                    <input type="radio" id="parve" name="kind" value="parve" required>
                    <label for="parve">פרווה</label>
                </span>
            </div>
        </fieldset>

        <div class="row">
            <div class="field-group">
                <label for="category">קטגוריה</label>
                <select name="category" id="category">
                    <option value="100"></option>
                    <option value="101">מרקים</option>
                    <option value="102">עיקריות</option>
                    <option value="103">סלטים</option>
                    <option value="104">מאפים</option>
                    <option value="105">קינוחים</option>
                </select>
            </div>
            
            <div class="field-group">
                <label for="prep-time">זמן הכנה</label>
                <input type="time" id="prep-time" name="prep-time" value="00:10" max="05:00" required>
            </div>

            <div class="field-group">
                <label for="servings">מספר מנות</label>
                <input type="number" id="servings" name="servings" min="1" max="50" value="4">
            </div>
        </div>

        <div class="field">
            <label for="ingredients">מצרכים</label>
            <textarea id="ingredients" name="ingredients" rows="5" required></textarea>
        </div>

        <div class="field">
            <label for="steps">אופן ההכנה</label>
            <textarea id="steps" name="steps" rows="6" required></textarea>
        </div>

        <fieldset>
            <legend>מתאים ל...</legend>
            <div class="options">
                <span class="option">
                    <input type="checkbox" id="holydays" name="holydays">
                    <label for="holydays">חגים</label>
                </span>
                <span class="option">
                    <input type="checkbox" id="kids" name="kids">
                    <label for="kids">ילדים</label>
                </span>
                <span class="option">
                    <input type="checkbox" id="quick" name="quick">
                    <label for="quick">הכנה מהירה</label>
                </span>
            </div>
        </fieldset>

        <div class="field">
            <label for="img">תמונה של המנה</label>
            <input type="file" id="img" name="img" accept="image/*">
        </div>

        <div class="field">
            <button type="submit">שמירת המתכון</button>
        </div>
    </form>
</body>
</html>
